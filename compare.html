<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ascii animals · compare</title>
    <script>
      if (/Chrome\//.test(navigator.userAgent)) document.documentElement.classList.add("liquid");
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/page.css" />
    <style>
      .bars {
        position: fixed;
        top: 18px;
        left: 50%;
        translate: -50% 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .bars .glass { position: relative; }
      .choices.ideas b { font: 600 12px "Geist Mono", ui-monospace, monospace; margin-right: 6px; }
      .note {
        position: fixed;
        left: 50%;
        bottom: 22px;
        translate: -50% 0;
        max-width: min(640px, calc(100vw - 40px));
        padding: 10px 16px;
        border-radius: 16px;
        text-align: center;
        font-size: 13px;
        color: var(--text-soft);
        pointer-events: none;
      }
      .note kbd { font: 600 11px "Geist Mono", ui-monospace, monospace; color: var(--muted); }
    </style>
  </head>
  <body>
    <canvas aria-hidden="true"></canvas>
    <div class="bars">
      <div class="choices sets glass" role="radiogroup" aria-label="Animal"></div>
      <div class="choices ideas glass" role="radiogroup" aria-label="Option"></div>
    </div>
    <p class="note glass"></p>
    <script type="module" src="/compare.ts"></script>
  </body>
</html>
